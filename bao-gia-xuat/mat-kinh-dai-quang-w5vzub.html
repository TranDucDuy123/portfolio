<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Báo giá Mắt Kính Đại Quang × Duy Web – Tiệm trong hẻm, khách vẫn tìm tới</title>
<meta name="description" content="Website kính thuốc, Google Maps, Facebook, TikTok và Zalo OA nối về một mối, kèm tài liệu giải thích từng công cụ. Khởi tạo từ 7.500.000đ.">
<meta property="og:title" content="Báo giá Mắt Kính Đại Quang × Duy Web – Tiệm trong hẻm, khách vẫn tìm tới">
<meta property="og:description" content="Website kính thuốc, Google Maps, Facebook, TikTok và Zalo OA nối về một mối, kèm tài liệu giải thích từng công cụ. Khởi tạo từ 7.500.000đ.">
<meta property="og:type" content="website">
<meta property="og:locale" content="vi_VN">
<meta property="og:site_name" content="Đức Duy Web">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#1E293B; --slate-2:#334155;
  --accent:#E4572E; --bg:#F7F5F0; --paper:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E6E1D8;
  --soft: color-mix(in srgb, var(--accent) 9%, var(--paper));
  --radius:18px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
/* top bar */
.topbar{background:var(--slate);color:#fff;font-size:13px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.02em}
.brand span{color:var(--accent)}
.topbar a{text-decoration:none;opacity:.85}
/* hero */
.hero{background:var(--slate);color:#fff;padding:56px 0 64px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero:after{content:"";position:absolute;z-index:0;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:var(--accent);opacity:.18}
.eyebrow{font-family:var(--font);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(28px,5.4vw,48px);line-height:1.15;margin:12px 0 14px;font-weight:800;max-width:760px}
.hero p.sub{font-size:18px;opacity:.85;max-width:680px;margin:0}
.hero-total{display:inline-flex;gap:14px;align-items:baseline;margin-top:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 18px;flex-wrap:wrap}
.hero-total b{font-family:var(--mono);font-size:24px;color:#fff}
.hero-meta{margin-top:18px;font-size:13px;opacity:.65}
/* toc */
.toc{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toc .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.toc a{white-space:nowrap;font-size:13px;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.toc a:hover{border-color:var(--accent)}
/* sections */
section.block{padding:56px 0;border-bottom:1px solid var(--line)}
.num{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:14px}
h2{font-size:clamp(24px,3.6vw,34px);line-height:1.2;margin:4px 0 14px;font-weight:800}
h3{font-size:18px;margin:0 0 8px}
.lead{font-size:19px;font-weight:600}
.intro{color:var(--muted);max-width:760px;margin:0 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.label{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.foot{font-size:13px;color:var(--muted);margin-top:18px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:6px 0 6px 22px;position:relative}
ul.clean li:before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--accent)}
/* stats */
.stat .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--accent);line-height:1.1}
.stat .l{font-weight:700;margin:6px 0 4px}
.stat .n{font-size:14px;color:var(--muted)}
/* accordions */
details.acc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px}
details.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;font-weight:700}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"+";font-family:var(--mono);color:var(--accent);font-size:20px;line-height:1}
details.acc[open] summary:after{content:"–"}
details.acc .body{padding:0 18px 18px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.panel[hidden]{display:none}
.panel-title{display:none}
/* why flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.flow .step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.flow .step:before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px}
.flow .step b{display:block;margin-top:4px}
.flow .step small{color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vs div{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.vs .old{background:#EEE;color:#777;text-decoration:line-through}
.vs .new{background:var(--slate);color:#fff}
.result{margin-top:12px;padding:14px 18px;border-left:4px solid var(--accent);background:var(--paper);border-radius:0 12px 12px 0}
/* positioning */
.bands{display:grid;gap:10px}
.band{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.band .bl{font-family:var(--font);font-weight:600;font-size:12px;color:var(--muted);margin-bottom:8px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);margin:3px 4px 3px 0;font-size:14px;background:var(--bg)}
.pill.me{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.callout{border-radius:var(--radius);padding:20px 22px;background:var(--slate);color:#fff;margin-top:14px}
.callout .label{color:rgba(255,255,255,.6);margin-top:0}
.ask{border:2px dashed var(--accent);border-radius:var(--radius);padding:18px 22px;margin-top:14px;background:var(--paper)}
.ask .label{color:var(--accent);margin-top:0}
/* channels */
.score{display:flex;gap:4px;align-items:center}
.score i{width:18px;height:8px;border-radius:3px;background:var(--line);display:inline-block}
.score i.on{background:var(--accent)}
.crit-row{display:grid;grid-template-columns:150px 1fr 24px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.crit-row:last-child{border-bottom:0}
.tagline{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
/* audit */
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .4s}
.issue{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.issue .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#FDECEC;color:#C62828}
.issue .imp{font-size:14px;color:var(--muted)}
.issue .fix{display:none;font-size:14px;margin-top:6px;color:#1B7F4B;font-weight:600}
.issue.done{border-color:#1B7F4B}
.issue.done .ic{background:#E5F5EC;color:#1B7F4B}
.issue.done .fix{display:block}
.issue.done b{text-decoration:line-through;opacity:.6}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--slate);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--accent)}
/* story */
.quote{font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.35;border-left:6px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 22px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.kv dd{margin:0}
/* identity */
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;padding:0;color:var(--ink)}
.sw .c{height:84px}
.sw .t{padding:10px 12px;font-size:13px}
.sw .t b{font-family:var(--mono)}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dodont .card h3{font-size:15px}
.tone{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.tone .o{color:var(--muted);text-decoration:line-through}
.tone .n{font-weight:600}
/* loop & milestones */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.loop .card{position:relative}
.loop .card .k{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.loop .card.focus{border:2px solid var(--accent)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stage .dw{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent)}
/* timeline */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:14px}
.week{font:inherit;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);cursor:pointer;color:var(--ink)}
.week b{font-family:var(--mono);display:block;color:var(--accent)}
.week small{font-size:12px}
.week[aria-selected="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.week[aria-selected="true"] b{color:#fff}
/* pricing */
.price{font-family:var(--mono);font-weight:700;font-size:28px;line-height:1.1}
.price small{font-family:var(--font);font-size:14px;font-weight:500;color:var(--muted)}
.opt{display:block;cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .card{height:100%;transition:border-color .2s,box-shadow .2s}
.opt input:checked + .card{border:2px solid var(--accent);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt input:focus-visible + .card{outline:3px solid var(--accent);outline-offset:2px}
.rec{position:absolute;top:-10px;right:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.offer{background:var(--slate);color:#fff;border-radius:var(--radius);padding:22px;margin:16px 0}
.offer .count{font-family:var(--mono);background:var(--accent);padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700}
.offer .grid .it{background:rgba(255,255,255,.07);border-radius:12px;padding:14px}
.offer .grid .it b{display:block;margin-bottom:4px}
.offer .grid .it span{font-size:14px;opacity:.8}
.addon{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:8px}
.addon input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.addon .p{margin-left:auto;font-family:var(--mono);font-weight:700;white-space:nowrap}
.est{background:var(--paper);border:2px solid var(--slate);border-radius:var(--radius);padding:22px;margin-top:18px}
.est .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.est .row b{font-family:var(--mono)}
.est .row.total{border-bottom:0;font-size:18px;font-weight:800}
.est .row.dep{color:var(--accent);font-weight:700;border-bottom:0}
.est input[type=range]{width:100%;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* roadmap */
.road .card.cur{border:2px solid var(--accent)}
.road .stepn{font-family:var(--font);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:700}
/* portfolio */
.pf .logo{width:40px;height:40px;border-radius:10px;background:var(--slate);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
/* closing */
.reasons{counter-reset:r}
.reasons .card{position:relative;padding-left:62px}
.reasons .card:before{counter-increment:r;content:counter(r);position:absolute;left:20px;top:20px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
ol.next{padding-left:20px}
ol.next li{padding:6px 0}
footer{background:var(--slate);color:#fff;padding:40px 0;text-align:center}
footer .actions{justify-content:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.print-only{display:none}
@media (max-width:640px){
  .crit-row{grid-template-columns:110px 1fr 20px}
  .dodont,.tone,.vs{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .hero{padding:40px 0 48px}
  section.block{padding:40px 0}
}
/* ---------- PRINT / PDF ---------- */
@page{size:A4;margin:14mm 12mm}
@media print{
  body{background:#fff;font-size:12.5px}
  .toc,.tabs,.weeks,.btn,.actions,.no-print,.toast,input[type=range]{display:none!important}
  .print-only{display:block}
  .hero{padding:28px 0 32px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero:after{display:none}
  section.block{padding:22px 0;break-inside:auto}
  .num,h2,.intro,.label,h3{break-after:avoid}
  .card,.issue,.band,.stat,.step,details.acc,.addon,.offer,.est,.callout,.ask{break-inside:avoid}
  .panel[hidden]{display:block!important}
  .panel{margin-bottom:12px}
  .panel-title{display:block;font-weight:800;font-size:15px;margin:10px 0 6px;color:var(--accent)}
  details.acc .body{display:block!important}
  details.acc summary:after{display:none}
  .issue .fix{display:block}
  .opt input:not(:checked) + .card{border:1px solid var(--line);box-shadow:none}
  .wrap{max-width:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<nav class="toc" aria-label="Mục lục"><div class="wrap" id="toc"></div></nav>
<main id="main"></main>
<footer><div class="wrap" id="footer"></div></footer>

 thì điện thoại của khách là tấm bảng hiệu mới.", "flow_title": "Trước đây khách đi ngang thấy tiệm. Từ nay khách thấy tiệm trên điện thoại rồi mới đến", "old_label": "Mặt đường", "new_label": "Trong hẻm", "steps": [{"title": "Thấy tiệm trên mạng", "sub": "Facebook, TikTok, Google"}, {"title": "Vào web xem cho chắc", "sub": "giá tròng, đo mắt, bảo hành, ảnh thật"}, {"title": "Nhắn Zalo, hỏi đường", "sub": "Google Maps dẫn tới tận cửa hẻm"}, {"title": "Quay lại lần sau", "sub": "Zalo OA nhắc đo mắt, khách giới thiệu thêm"}], "result": "khách tìm đến vì tin chuyên môn kính thuốc, không phải vì tình cờ đi ngang.", "tips": [{"title": "Kính thuốc là món phải tin mới mua", "body": "Người cận, loạn, lão thị lo nhất là đo sai độ, tròng kém, đeo bị nhức. Họ chọn tiệm có chuyên môn chứ không chọn tiệm gần nhất. Nội dung cho thấy cách anh đo mắt và lắp tròng đáng giá hơn mọi chương trình giảm giá."}, {"title": "Đường vào hẻm phải dễ như ngoài mặt đường", "body": "Một video 20 giây quay đường từ đầu hẻm vào tiệm, đặt trên web, Google Maps và Zalo. Khách không ngại vào hẻm, khách ngại bị lạc."}, {"title": "Khách cũ là nguồn rẻ nhất", "body": "Người đã làm kính ở tiệm sẽ cần đo lại sau 1–2 năm, cần kính cho con, cho ba mẹ. Giữ được liên lạc qua Zalo OA thì mỗi khách cũ là một nguồn khách quay lại, không tốn tiền quảng cáo."}]}, {"type": "custom", "title": "Tài liệu tham khảo: hiểu nhanh từng công cụ", "nav": "Tài liệu", "intro": "Mỗi công cụ một khung: nó là gì, hợp làm gì cho tiệm kính, tốn gì, và chỗ hay hiểu nhầm. Bấm vào từng dòng để mở.", "html": "<details class='acc' open><summary>Website: nhà chính của tiệm trên mạng<\/summary><div class='body'><p><b>Là gì:<\/b> một địa chỉ riêng (tên miền) đứng tên tiệm. Mọi thứ trên đó là của anh: nội dung, hình ảnh, danh sách khách để lại liên hệ.<\/p><p><b>Hợp làm gì:<\/b> trình bày đầy đủ về kính thuốc (các loại tròng, giá, quy trình đo mắt, bảo hành), video đường vào hẻm, nút Zalo và gọi. Là nơi mọi kênh khác dẫn khách về.<\/p><p><b>Tốn gì:<\/b> tiền làm một lần, sau đó tiền duy trì hằng năm (tên miền, máy chủ).<\/p><p><b>Hay hiểu nhầm:<\/b> \"Có fanpage rồi cần gì web.\" Fanpage là nhà thuê trên đất của Facebook: Facebook đổi luật, khoá trang hay giảm hiển thị là mất. Web là nhà của mình.<\/p><\/div><\/details><details class='acc'><summary>Facebook Ads: trả tiền để nhiều người thấy<\/summary><div class='body'><p><b>Là gì:<\/b> trả tiền để bài viết hoặc video hiện cho người ở gần tiệm, đúng độ tuổi, đúng sở thích.<\/p><p><b>Hợp làm gì:<\/b> giới thiệu tiệm với người quanh khu vực, chạy chương trình đo mắt, mùa tựu trường.<\/p><p><b>Tốn gì:<\/b> ngân sách quảng cáo do anh tự đặt, tắt lúc nào cũng được.<\/p><p><b>Hay hiểu nhầm:<\/b> \"Chạy quảng cáo là ra khách.\" Quảng cáo chỉ mang người tới. Tắt quảng cáo thì người ta đi luôn, trừ khi họ đã vào web, đã nhắn Zalo, đã lưu lại tiệm. Đó là lý do phải có web và Zalo OA đi kèm.<\/p><\/div><\/details><details class='acc'><summary>TikTok: video ngắn để được biết đến<\/summary><div class='body'><p><b>Là gì:<\/b> mạng video ngắn, video hay có thể tới rất nhiều người mà không cần trả tiền.<\/p><p><b>Hợp làm gì:<\/b> quay cảnh đo mắt, lắp tròng, chỉnh gọng, khách đeo kính mới. Người xem thấy chuyên môn của anh tận mắt.<\/p><p><b>Tốn gì:<\/b> chủ yếu là thời gian quay và đăng đều.<\/p><p><b>Hay hiểu nhầm:<\/b> \"Video nhiều lượt xem là thành công.\" Lượt xem chưa phải khách. Cần đếm được bao nhiêu người từ TikTok bấm vào web và nhắn Zalo, mới biết video nào đáng làm tiếp.<\/p><\/div><\/details><details class='acc'><summary>Zalo OA: giữ liên lạc với khách cũ<\/summary><div class='body'><p><b>Là gì:<\/b> tài khoản Zalo chính thức của tiệm. Khách bấm quan tâm là anh nhắn được cho họ, có tên tiệm và dấu xác thực.<\/p><p><b>Hợp làm gì:<\/b> nhắc đo mắt lại sau 12 tháng, báo kính đã làm xong, nhắc bảo hành, gửi ưu đãi cho khách cũ, trả lời tin nhắn có sẵn câu mẫu.<\/p><p><b>Tốn gì:<\/b> có gói miễn phí. Gói trả phí và tin nhắn chủ động (ZNS) tính tiền theo bảng giá của Zalo. Chỉ bật khi thật sự cần.<\/p><p><b>Hay hiểu nhầm:<\/b> \"Phải làm mini app trên Zalo mới chuyên nghiệp.\" Với một tiệm kính, Zalo OA kèm menu và vài mẫu tin nhắn đã đủ, rẻ hơn và dễ dùng hơn mini app nhiều.<\/p><\/div><\/details><details class='acc'><summary>Google Maps: tấm bảng hiệu mới của tiệm trong hẻm<\/summary><div class='body'><p><b>Là gì:<\/b> hồ sơ của tiệm trên Google: địa chỉ, giờ mở cửa, ảnh, đánh giá, nút chỉ đường.<\/p><p><b>Hợp làm gì:<\/b> người tìm \"cắt kính gần đây\" thấy tiệm, xem đánh giá, bấm chỉ đường là tới tận nơi.<\/p><p><b>Tốn gì:<\/b> miễn phí.<\/p><p><b>Hay hiểu nhầm:<\/b> \"Đã có trên bản đồ là xong.\" Ghim cần đúng vị trí trong hẻm, có ảnh đầu hẻm, mặt tiền, và đánh giá đều đặn mới đứng lên trên.<\/p><\/div><\/details><details class='acc'><summary>SEO: được Google tự giới thiệu, không trả tiền mỗi lượt<\/summary><div class='body'><p><b>Là gì:<\/b> viết nội dung trên web đúng câu khách hay tìm, để Google đưa web lên khi có người tìm.<\/p><p><b>Hợp làm gì:<\/b> các câu như \"cắt kính cận lấy liền\", \"tròng chống ánh sáng xanh giá bao nhiêu\", \"đo mắt cho trẻ em\" kèm tên khu vực.<\/p><p><b>Tốn gì:<\/b> công viết bài đều đặn. Kết quả đến chậm (thường 2–4 tháng) nhưng không mất khi ngừng trả tiền.<\/p><p><b>Hay hiểu nhầm:<\/b> \"SEO là có ngay.\" SEO giống trồng cây, quảng cáo giống mua rau. Nên làm cả hai: quảng cáo cho hôm nay, SEO cho năm sau.<\/p><\/div><\/details>"}, {"type": "custom", "title": "Vì sao website nằm ở giữa: 4 cặp ghép", "nav": "Web ở giữa", "intro": "Mỗi kênh mạnh một việc. Ghép với website thì kênh đó làm được việc mà một mình nó không làm được.", "html": "<div class='grid g2'><div class='card' style='border-top:5px solid var(--accent)'><div class='label' style='margin-top:0'>Facebook + Web<\/div><h3>Tấm bảo hiểm khi tắt quảng cáo<\/h3><p style='margin:0 0 8px'>Quảng cáo đưa người tới web. Web ghi nhớ những người đã ghé (bằng mã đo của Facebook). Tháng sau dù tạm dừng quảng cáo, khách vẫn tìm lại được w     return '<div class="grid g2"><div class="card"><div class="tagline">'+esc(c.tag||'')+'</div><h3 style="margin-top:4px">'+esc(c.name)+'</h3>'+(c.customer?'<div class="label">Khách làm gì ở đây</div><p style="margin:0">'+esc(c.customer)+'</p>':'')+'<div class="label">Nhận định cho '+esc(who)+'</div><p style="margin:0">'+esc(c.assessment)+'</p></div><div class="card">'+(crit.length?sc:'')+(c.in_package&&c.in_package.length?'<div class="label">Làm trong gói</div>'+list(c.in_package):'')+(c.measure?'<div class="label">Đo gì khi đánh giá</div><p style="margin:0">'+esc(c.measure)+'</p>':'')+'</div></div>';
  });
  var h=head(s,i);
  if(crit.length&&ch.length>1){
    var byCrit=crit.map(function(k,j){var rows=ch.map(function(c){return {n:c.name,v:(c.scores||[])[j]||0}}).sort(function(a,b){return b.v-a.v});
      return '<div class="card">'+rows.map(function(r){return '<div class="crit-row"><span>'+esc(r.n)+'</span><span class="score">'+[1,2,3,4,5].map(function(n){return '<i class="'+(n<=r.v?'on':'')+'"></i>'}).join('')+'</span><b>'+r.v+'</b></div>'}).join('')+'</div>'});
    h+='<div class="no-print" style="margin-bottom:10px">'+tabs(['Xem từng kênh','So sánh theo tiêu chí'],[tabs(ch.map(function(c){return c.name}),one),tabs(crit,byCrit)])+'</div>';
    h+='<div class="print-only">'+one.map(function(p,j){return '<div class="panel-title">'+esc(ch[j].name)+'</div>'+p}).join('')+'</div>';
  } else h+=tabs(ch.map(function(c){return c.name}),one);
  return h+foot(s);
};
R.audit=function(s,i){

  if(s.colors) h+='<div class="label">Bảng màu · bấm để chép mã</div><div class="grid g3">'+s.colors.map(function(c){return '<button class="sw" data-hex="'+esc(c.hex)+'"><div class="c" style="background:'+esc(c.hex)+'"></div><div class="t"><b>'+esc(c.hex)+'</b> · '+esc(c.name)+'<br><span style="color:var(--muted)">'+esc(c.use)+'</span></div></button>'}).join('')+'</div>';

R.loop=function(s,i){

R.milestones=function(s,i){

R.timeline=function(s,i){

R.partner=function(s,i){

R.pricing=function(s,i){
  var h=head(s,i), setup=(s.setup&&s.setup.options)||[], mon=(s.monthly&&s.monthly.options)||[], add=s.addons||[];
  var recIdx=Math.max(0,setup.findIndex(function(o){return o.recommended}));
  if(setup.length){
    h+='<div class="label">'+esc((s.setup&&s.setup.label)||'Giai đoạn 1 · Một lần')+'</div><div class="grid '+(setup.length>1?'g3':'')+'">'+setup.map(function(o,j){
      return '<label class="opt"><input type="radio" name="setup" value="'+j+'"'+(j===recIdx?' checked':'')+'><div class="card">'+(o.recommended&&setup.length>1?'<span class="rec">Đề xuất</span>':'')+'<h3>'+esc(o.name)+'</h3><div class="price">'+money(o.price)+' <small>'+esc(o.price_note||'trọn gói')+'</small></div><p style="color:var(--muted);font-size:14px">'+esc(o.desc)+'</p>'+list(o.includes)+(o.why?'<div class="label">Vì sao mức này</div><p style="margin:0;font-size:14px">'+esc(o.why)+'</p>':'')+'</div></label>'}).join('')+'</div>';
  }
  if(s.offer){
    var o=s.offer, days='';
    if(o.deadline){var d=Math.ceil((new Date(o.deadline+'T23:59:59+07:00')-new Date())/864e5);days=d>0?'Còn '+d+' ngày':'Đã hết hạn';}
    h+='<div class="offer"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><b style="font-size:18px">'+esc(o.title)+'</b><div style="opacity:.75;font-size:14px">'+esc(o.condition||'')+'</div></div>'+(days?'<span class="count">'+days+'</span>':'')+'</div><div class="grid g3" style="margin-top:14px">'+(o.items||[]).map(function(x){return '<div class="it"><b>'+esc(x.title)+'</b><span>'+esc(x.body)+'</span></div>'}).join('')+'</div>'+(o.note?'<div style="font-size:13px;opacity:.7;margin-top:10px">'+esc(o.note)+'</div>':'')+'</div>';
  }
  if(add.length){h+='<div class="label">Hạng mục thêm · chọn nếu cần</div>'+add.map(function(a,j){return '<label class="addon"><input type="checkbox" name="addon" value="'+j+'"'+(a.checked?' checked':'')+'><div><b>'+esc(a.name)+'</b><div class="foot" style="margin:0">'+esc(a.desc)+'</div></div><span class="p">+'+money(a.price)+'</span></label>'}).join('')}
  if(mon.length){
    var mrec=Math.max(0,mon.findIndex(function(o){return o.recommended}));
    h+='<div class="label" style="margin-top:22px">'+esc((s.monthly&&s.monthly.label)||'Giai đoạn 2 · Vận hành hằng tháng')+'</div><div class="grid g3">'+mon.map(function(o,j){return '<label class="opt"><input type="radio" name="monthly" value="'+j+'"'+(j===mrec?' checked':'')+'><div class="card"><div class="price">'+(+o.price?money(o.price)+' <small>/tháng</small>':'0đ <small>miễn phí</small>')+'</div><h3 style="margin-top:6px">'+esc(o.name)+'</h3><p style="margin:0;color:var(--muted);font-size:14px">'+esc(o.desc)+'</p></div></label>'}).join('')+'</div>'+(s.monthly.note?'<p class="foot">'+esc(s.monthly.note)+'</p>':'');
  }
  if(s.exclusions) h+='<p class="foot">'+esc(s.exclusions)+'</p>';
  /* estimator */
  h+='<div class="est" id="est"><div class="label" style="margin-top:0">Ước tính của anh/chị</div>';
  if(mon.length) h+='<div class="no-print"><div style="display:flex;justify-content:space-between"><span>Số tháng duy trì dự kiến</span><b id="mval">'+(s.months_default!=null?s.months_default:2)+' tháng</b></div><input type="range" id="months" min="0" max="12" value="'+(s.months_default!=null?s.months_default:2)+'"></div>';
  h+='<div id="erows"></div><div class="actions"><a class="btn acc" id="zbtn" href="https://zalo.me/'+esc(C.zalo)+'" target="_blank" rel="noopener">Xác nhận qua Zalo</a><a class="btn alt" href="tel:'+esc(C.zalo)+'">Gọi</a><button class="btn alt" id="cbtn">Chép</button></div><p class="foot no-print">Nút xác nhận chép sẵn lựa chọn của anh/chị và mở Zalo '+esc(C.phone)+'.</p></div>';
  return h+foot(s);
};
R.roadmap=function(s,i){
  var st=s.steps||[];
  var h=head(s,i)+'<div class="grid g3 road">'+st.map(function(x,j){return '<div class="card'+(x.current?' cur':'')+'"><div class="stepn">BƯỚC '+(j+1)+(x.current?' · ĐANG ĐỀ XUẤT':'')+'</div><h3 style="margin-top:4px">'+esc(x.name)+'</h3><div class="price" style="font-size:22px">'+esc(x.price_label)+'</div><div class="label">Mở khi</div><p style="margin:0">'+esc(x.open_when)+'</p><div class="label">Mục tiêu</div><p style="margin:0">'+esc(x.goal)+'</p>'+(x.includes?'<div class="label">Bao gồm</div>'+list(x.includes):'')+'</div>'}).join('')+'</div>';
  if(s.note) h+='<div class="result">'+esc(s.note)+'</div>';
  return h+foot(s);
};
R.portfolio=function(s,i){
  return head(s,i)+'<div class="grid g3 pf">'+(s.items||[]).map(function(x){return '<div class="card"><div class="logo">'+esc((x.domain||'?').charAt(0).toUpperCase())+'</div><b>'+esc(x.domain)+'</b>'+(x.industry?' <span class="foot">· '+esc(x.industry)+'</span>':'')+'<div style="margin:8px 0">'+(x.services||[]).map(function(v){return '<span class="chip">'+esc(v)+'</span>'}).join('')+'</div><p style="margin:0;font-size:14px;color:var(--muted)">'+esc(x.desc)+'</p></div>'}).join('')+'</div>'+foot(s);
};
R.closing=function(s,i){
  var h=head(s,i)+(s.summary?'<p class="lead">'+esc(s.summary)+'</p>':'');
  if(s.reasons) h+='<div class="grid g2 reasons">'+s.reasons.map(function(x){return '<div class="card"><h3>'+esc(x.title)+'</h3><p style="margin:0;color:var(--muted)">'+esc(x.body)+'</p></div>'}).join('')+'</div>';
  if(s.next_steps) h+='<div class="card" style="margin-top:14px"><h3>Bước tiếp theo</h3><ol class="next">'+s.next_steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>';
  return h;
};
R.custom=function(s,i){return head(s,i)+(s.html||'')+foot(s)};

/* ---------- build ---------- */
var hero=Q.hero||{};
document.getElementById('hero').innerHTML='<div class="eyebrow">'+esc(hero.eyebrow||('Báo giá · '+((Q.meta&&Q.meta.client_name)||'')))+'</div><h1>'+esc(hero.headline||'')+'</h1><p class="sub">'+esc(hero.sub||'')+'</p>'+(hero.total_value?'<div class="hero-total"><span>'+esc(hero.total_label||'Đề xuất')+'</span><b>'+esc(hero.total_value)+'</b></div>':'')+'<div class="hero-meta">'+esc(C.brand)+' · '+esc((Q.meta&&Q.meta.date)||'')+(Q.meta&&Q.meta.valid_until?' · Báo giá có hiệu lực đến '+esc(Q.meta.valid_until):'')+'</div>';
document.getElementById('topContact').textContent='Zalo '+C.phone;
document.getElementById('topContact').href='https://zalo.me/'+C.zalo;
var main=document.getElementById('main'), toc=[], n=0;
(Q.sections||[]).forEach(function(s){
  var fn=R[s.type]; if(!fn) return; n++;
  var sec=document.createElement('section'); sec.className='block'; sec.id='s'+n;
  sec.innerHTML='<div class="wrap">'+fn(s,n)+'</div>'; main.appendChild(sec);
  toc.push('<a href="#s'+n+'">'+String(n).padStart(2,'0')+' · '+esc(s.nav||s.title)+'</a>');
});
document.getElementById('toc').innerHTML=toc.join('');
document.getElementById('footer').innerHTML='<div style="font-weight:800;font-size:20px">'+esc(C.brand)+' · đồng hành cùng '+esc((Q.meta&&Q.meta.client_name)||'')+'</div><p style="opacity:.7">'+esc(C.phone)+' · '+esc(C.email)+'</p><div class="actions"><a class="btn acc" href="https://zalo.me/'+esc(C.zalo)+'" target="_blank" rel="noopener">Nhắn Zalo cho '+esc(C.brand)+'</a></div>';

/* ---------- interactions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('.tab,.week');
  if(b){var g=b.dataset.g,i=b.dataset.i;
    document.querySelectorAll('[role=tab][data-g="'+g+'"]').forEach(function(x){x.setAttribute('aria-selected',x.dataset.i===i)});
    document.querySelectorAll('.panel[data-g="'+g+'"]').forEach(function(x){x.hidden=x.dataset.i!==i});return;}
  var sw=e.target.closest('.sw'); if(sw){copy(sw.dataset.hex,'Đã chép mã màu '+sw.dataset.hex);return;}
  var is=e.target.closest('.issue'); if(is){is.classList.toggle('done');audit(is.closest('section'));return;}
  var all=e.target.closest('.a-all'); if(all){var sec=all.closest('section');var its=sec.querySelectorAll('.issue');var allDone=[].every.call(its,function(x){return x.classList.contains('done')});its.forEach(function(x){x.classList.toggle('done',!allDone)});audit(sec);return;}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('issue')){e.preventDefault();e.target.click()}});
function audit(sec){var its=sec.querySelectorAll('.issue'),d=sec.querySelectorAll('.issue.done').length;sec.querySelector('.a-done').textContent=d;sec.querySelector('.a-bar').style.width=(its.length?d/its.length*100:0)+'%';sec.querySelector('.a-all').textContent=d===its.length?'Xem lại hiện trạng':'Xử lý tất cả'}

var P=(Q.sections||[]).filter(function(s){return s.type==='pricing'})[0];
var summary='';
function est(){
  if(!P) return;
  var setup=(P.setup&&P.setup.options)||[], mon=(P.monthly&&P.monthly.options)||[], add=P.addons||[];
  var si=+((document.querySelector('input[name=setup]:checked')||{}).value||0);
  var mi=+((document.querySelector('input[name=monthly]:checked')||{}).value||0);
  var mr=document.getElementById('months'), m=mr?+mr.value:0;
  if(mr) document.getElementById('mval').textContent=m+' tháng';
  var rows=[], one=0, lines=[];
  if(setup[si]){one+=+setup[si].price;rows.push([(P.setup.row_label||'Khởi tạo')+' · '+setup[si].name,setup[si].price]);lines.push('- '+setup[si].name+': '+money(setup[si].price));}
  document.querySelectorAll('input[name=addon]:checked').forEach(function(x){var a=add[+x.value];one+=+a.price;rows.push(['+ '+a.name,a.price]);lines.push('- Thêm '+a.name+': '+money(a.price));});
  var monTotal=0;
  if(mon[mi]&&m>0){monTotal=mon[mi].price*m;rows.push([mon[mi].name+' × '+m+' tháng',monTotal]);lines.push('- Vận hành '+mon[mi].name+' × '+m+' tháng: '+money(monTotal));}
  var dep=Math.round(one*(P.deposit_percent||50)/100);
  var html=rows.map(function(r){return '<div class="row"><span>'+esc(r[0])+'</span><b>'+money(r[1])+'</b></div>'}).join('');
  html+='<div class="row total"><span>Tổng'+(m>0&&mon.length?' '+(m+1)+' tháng':'')+'</span><b>'+money(one+monTotal)+'</b></div>';
  html+='<div class="row dep"><span>Đợt 1 ('+(P.deposit_percent||50)+'% phần khởi tạo)</span><b>'+money(dep)+'</b></div>';
  document.getElementById('erows').innerHTML=html;
  summary='Chào '+C.brand+', bên mình ('+((Q.meta&&Q.meta.client_name)||'')+') xác nhận báo giá:\n'+lines.join('\n')+'\nTổng: '+money(one+monTotal)+'\nĐợt 1: '+money(dep)+'\nLink: '+location.href.split('#')[0];
}
document.addEventListener('change',function(e){if(e.target.name==='setup'||e.target.name==='monthly'||e.target.name==='addon')est()});
document.addEventListener('input',function(e){if(e.target.id==='months')est()});
est();
var zb=document.getElementById('zbtn'); if(zb) zb.addEventListener('click',function(){copy(summary,'Đã chép lựa chọn, dán vào Zalo để gửi')});
var cb=document.getElementById('cbtn'); if(cb) cb.addEventListener('click',function(){copy(summary,'Đã chép lựa chọn')});
/* in PDF: mở hết mọi phần */
window.addEventListener('beforeprint',function(){document.querySelectorAll('details.acc').forEach(function(d){d.open=true})});
if(/[?&]print\b/.test(location.search)){document.querySelectorAll('details.acc').forEach(function(d){d.open=true})}
})();
