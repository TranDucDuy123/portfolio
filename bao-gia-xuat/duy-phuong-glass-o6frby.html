<script>
(function(){
  var root=document.getElementById('app');
  var D;
  try{D=JSON.parse(document.getElementById('data').textContent)}catch(e){root.textContent='Dữ liệu báo giá không hợp lệ.';return}
  var M=D.meta||{};

  function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null&&x!=='')e.textContent=x;return e}
  function put(p){for(var i=1;i<arguments.length;i++){if(arguments[i])p.appendChild(arguments[i])}return p}
  function safeHref(h){return /^(https?:|tel:|mailto:)/i.test(h||'')?h:'#'}
  function lum(hex){
    var m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 0;
    var n=parseInt(m[1],16),c=[(n>>16)&255,(n>>8)&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
    return .2126*c[0]+.7152*c[1]+.0722*c[2];
  }
  if(M.accent&&/^#[0-9a-f]{6}$/i.test(M.accent)){
    document.documentElement.style.setProperty('--accent',M.accent);
    document.documentElement.style.setProperty('--accent-ink',lum(M.accent)>0.42?'#111111':'#ffffff');
  }
  document.title=M.title||('Báo giá '+(M.client||''));

  function section(id,title,intro){
    var s=$('section','sec');if(id)s.id=id;
    if(title)put(s,$('h2',null,title));
    if(intro)put(s,$('p','lead',intro));
    return s;
  }

  function planCard(p){
    var a=$('article','plan'+(p.recommended?' rec':''));
    if(p.recommended)put(a,$('div','badge',p.badge||'Khuyên dùng'));
    put(a,$('h3',null,p.name));
    if(p.tagline)put(a,$('p','tl',p.tagline));
    var pr=$('div','price');put(pr,$('b',null,p.price));if(p.unit)put(pr,$('span',null,p.unit));put(a,pr);
    if(p.forWho)put(a,$('p','for',p.forWho));
    var ul=$('ul','feat');
    (p.features||[]).forEach(function(f){
      var t=typeof f==='string'?f:f.text,inc=typeof f==='string'?true:f.included!==false;
      put(ul,$('li',inc?'':'no',t));
    });
    put(a,ul);
    if(p.delivery)put(a,$('p','deliv',p.delivery));
    return a;
  }

  var app=$('div');

  if(M.sample){put(app,$('div','sample','Dữ liệu minh họa — thay bằng thông tin khách thật trước khi gửi'))}

  var wrap=$('div','wrap');
  put(app,wrap);

  // top
  var top=$('div','top');
  put(top,put($('span'),$('b',null,M.brand||'')));
  var meta=[];if(M.client)meta.push('Dành cho '+M.client);if(M.date)meta.push(M.date);
  put(top,$('span',null,meta.join(' · ')));
  put(wrap,top);

  // hero
  var H=D.hero||{};
  var hero=$('header','hero');
  if(H.eyebrow)put(hero,$('p','eyebrow',H.eyebrow));
  if(H.headline)put(hero,$('h1',null,H.headline));
  if(H.sub)put(hero,$('p','sub',H.sub));
  if(H.highlights&&H.highlights.length){
    var ch=$('div','chips');
    H.highlights.forEach(function(h){put(ch,put($('div','chip'),$('b',null,h.value),$('span',null,h.label)))});
    put(hero,ch);
  }
  put(wrap,hero);

  // understand
  var U=D.understand;
  if(U){
    var s=section('hieu',U.title||'Chúng tôi hiểu điều bạn cần');
    if(U.quote){var q=$('blockquote','quote',U.quote);if(U.quoteBy)put(q,$('small',null,U.quoteBy));put(s,q)}
    if(U.points&&U.points.length){
      var pts=$('div','points card');
      U.points.forEach(function(p){put(pts,put($('div','point'),$('b',null,p.label),$('span',null,p.text)))});
      put(s,pts);

    put(wrap,s);

  // explain (giải thích các lựa chọn bằng ví dụ đời thường, ví dụ các loại hosting)

  if(X&&X.items&&X.items.length){
    var sx=section('giaithich',X.title||'Hiểu nhanh các lựa chọn',X.intro);

      var a=$('article','plan'+(it.recommended?' rec':''));

      if(it.analogy)put(a,$('p','analogy',it.analogy));
      var ul=$('ul','feat');
      (it.good||[]).forEach(function(t){put(ul,$('li',null,t))});
      (it.bad||[]).forEach(function(t){put(ul,$('li','con',t))});
      put(a,ul);
      if(it.fit)put(a,$('p','for','Hợp với: '+it.fit));

      put(gx,a);

    put(sx,gx);
    if(X.note)put(sx,$('p','fine',X.note));
    put(wrap,sx);

  // approach
  var A=D.approach;
  if(A&&A.items&&A.items.length){
    var s2=section('giaiphap',A.title||'Hướng giải quyết',A.intro);

      put(map,r);

    put(s2,map);put(wrap,s2);

  // packages
  var P=D.packages;
  if(P&&P.items&&P.items.length){
    var s3=section('goi',P.title||'Chọn gói phù hợp',P.note);

  }

  // running
  var R=D.running;
  if(R&&R.rows&&R.rows.length){
    var s4=section('chiphi',R.title||'Hosting và vận hành',R.intro);
    var cs=$('div','costs');
    R.rows.forEach(function(r){
      var c=$('div','cost');
      var a1=$('div');put(a1,$('b',null,r.item));if(r.note)put(a1,$('small',null,r.note));
      var a2=$('div','amt',(r.cost||'')+(r.period?' '+r.period:''));
      var a3=$('div','who',r.payer||'');
      put(c,a1,a2,a3);put(cs,c);

    put(s4,cs);
    var C=D.care;
    if(C&&C.items&&C.items.length){
      var ch2=$('div');ch2.style.marginTop='30px';
      put(ch2,$('h2',null,C.title||'Gói chăm sóc hàng tháng'));ch2.firstChild.style.fontSize='clamp(1.2rem,3.4vw,1.5rem)';
      if(C.intro)put(ch2,$('p','lead',C.intro));
      var cp=$('div','plans');C.items.forEach(function(p){put(cp,planCard(p))});
      put(ch2,cp);
      if(C.fine)put(ch2,$('p','fine',C.fine));
      put(s4,ch2);
    }
    put(wrap,s4);
  }

  // total
  var T=D.total;
  if(T&&T.sum){
    var tb=$('div','total');
    put(tb,$('h3',null,T.title||'Tổng chi phí'));
    (T.lines||[]).forEach(function(l){put(tb,put($('div','ln'),$('span',null,l.label),$('span',null,l.value)))});
    put(tb,put($('div','sum'),$('span',null,'Tổng'),$('b',null,T.sum)));
    if(T.note)put(tb,$('p','nt',T.note));
    var tw=$('section','sec');tw.style.marginTop='24px';put(tw,tb);put(wrap,tw);
  }

  // timeline
  var TL=D.timeline;
  if(TL&&TL.steps&&TL.steps.length){
    var s5=section('quytrinh',TL.title||'Quy trình');
    var st=$('ol','steps');
    TL.steps.forEach(function(x){
      var li=$('li','step');
      put(li,$('b',null,x.step));
      if(x.when)put(li,$('span','when',x.when));
      if(x.clientDo)put(li,$('p','me','Phía anh: '+x.clientDo));
      put(st,li);

    put(s5,st);put(wrap,s5);
  }

  // why + proof
  [['why',D.why,'Vì sao chọn chúng tôi'],['proof',D.proof,'Dự án đã thực hiện']].forEach(function(g){
    var X=g[1];if(!X||!X.items||!X.items.length)return;
    var s6=section(g[0],X.title||g[2]);
    var cd=$('div','cards');
    X.items.forEach(function(it){put(cd,put($('div','card'),$('h3',null,it.title),$('p',null,it.text)))});
    put(s6,cd);put(wrap,s6);
  });

  // terms
  if(D.terms&&D.terms.length){
    var s7=section('dieukhoan','Điều khoản chính');
    var tu=$('ul','terms');D.terms.forEach(function(t){put(tu,$('li',null,t))});
    put(s7,tu);put(wrap,s7);
  }

  // faq
  if(D.faq&&D.faq.length){
    var s8=section('hoidap','Câu hỏi thường gặp');
    D.faq.forEach(function(f){
      var d=$('details');put(d,put($('summary'),$('span',null,f.q)),$('p',null,f.a));put(s8,d);

  var K=D.cta||{};

  put(cta,$('h2',null,K.headline||'Sẵn sàng bắt đầu?'));

  var b=$('a','btn',K.button||'Liên hệ xác nhận');b.href=safeHref(K.href);

  var ft=[];if(M.contact)ft.push(M.contact);if(M.validUntil)ft.push('Báo giá có hiệu lực đến '+M.validUntil);

  // sticky

  else put(tx,$('b',null,M.client||'Báo giá'));
  var b2=$('a','btn',K.button||'Liên hệ');b2.href=safeHref(K.href);
  if(/^https?:/i.test(b2.href)){b2.target='_blank';b2.rel='noopener'}
  put(sb,tx,b2);put(app,sb);

  root.appendChild(app);
