<style>
:root{
  --slate:#1E293B; --slate-2:#334155;
  --accent:#E4572E; --bg:#F7F5F0; --paper:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E6E1D8;
  --soft: color-mix(in srgb, var(--accent) 9%, var(--paper));
  --radius:18px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
/* top bar */
.topbar{background:var(--slate);color:#fff;font-size:13px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;letter-spacing:.02em}
.brand span{color:var(--accent)}
.topbar a{text-decoration:none;opacity:.85}
/* hero */
.hero{background:var(--slate);color:#fff;padding:56px 0 64px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero:after{content:"";position:absolute;z-index:0;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:var(--accent);opacity:.18}
.eyebrow{font-family:var(--font);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h1{font-size:clamp(28px,5.4vw,48px);line-height:1.15;margin:12px 0 14px;font-weight:800;max-width:760px}
.hero p.sub{font-size:18px;opacity:.85;max-width:680px;margin:0}
.hero-total{display:inline-flex;gap:14px;align-items:baseline;margin-top:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 18px;flex-wrap:wrap}
.hero-total b{font-family:var(--mono);font-size:24px;color:#fff}
.hero-meta{margin-top:18px;font-size:13px;opacity:.65}
/* toc */
.toc{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toc .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.toc a{white-space:nowrap;font-size:13px;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.toc a:hover{border-color:var(--accent)}
/* sections */
section.block{padding:56px 0;border-bottom:1px solid var(--line)}
.num{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:14px}
h2{font-size:clamp(24px,3.6vw,34px);line-height:1.2;margin:4px 0 14px;font-weight:800}
h3{font-size:18px;margin:0 0 8px}
.lead{font-size:19px;font-weight:600}
.intro{color:var(--muted);max-width:760px;margin:0 0 24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.label{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.foot{font-size:13px;color:var(--muted);margin-top:18px}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:6px 0 6px 22px;position:relative}
ul.clean li:before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--accent)}
/* stats */
.stat .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--accent);line-height:1.1}
.stat .l{font-weight:700;margin:6px 0 4px}
.stat .n{font-size:14px;color:var(--muted)}
/* accordions */
details.acc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px}
details.acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;font-weight:700}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:"+";font-family:var(--mono);color:var(--accent);font-size:20px;line-height:1}
details.acc[open] summary:after{content:"–"}
details.acc .body{padding:0 18px 18px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.panel[hidden]{display:none}
.panel-title{display:none}
/* why flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.flow .step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.flow .step:before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px}
.flow .step b{display:block;margin-top:4px}
.flow .step small{color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vs div{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700}
.vs .old{background:#EEE;color:#777;text-decoration:line-through}
.vs .new{background:var(--slate);color:#fff}
.result{margin-top:12px;padding:14px 18px;border-left:4px solid var(--accent);background:var(--paper);border-radius:0 12px 12px 0}
/* positioning */
.bands{display:grid;gap:10px}
.band{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.band .bl{font-family:var(--font);font-weight:600;font-size:12px;color:var(--muted);margin-bottom:8px}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);margin:3px 4px 3px 0;font-size:14px;background:var(--bg)}
.pill.me{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.callout{border-radius:var(--radius);padding:20px 22px;background:var(--slate);color:#fff;margin-top:14px}
.callout .label{color:rgba(255,255,255,.6);margin-top:0}
.ask{border:2px dashed var(--accent);border-radius:var(--radius);padding:18px 22px;margin-top:14px;background:var(--paper)}
.ask .label{color:var(--accent);margin-top:0}
/* channels */
.score{display:flex;gap:4px;align-items:center}
.score i{width:18px;height:8px;border-radius:3px;background:var(--line);display:inline-block}
.score i.on{background:var(--accent)}
.crit-row{display:grid;grid-template-columns:150px 1fr 24px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.crit-row:last-child{border-bottom:0}
.tagline{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
/* audit */
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .4s}
.issue{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
.issue .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#FDECEC;color:#C62828}
.issue .imp{font-size:14px;color:var(--muted)}
.issue .fix{display:none;font-size:14px;margin-top:6px;color:#1B7F4B;font-weight:600}
.issue.done{border-color:#1B7F4B}
.issue.done .ic{background:#E5F5EC;color:#1B7F4B}
.issue.done .fix{display:block}
.issue.done b{text-decoration:line-through;opacity:.6}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--slate);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--accent)}
/* story */
.quote{font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.35;border-left:6px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 22px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:15px}
.kv dt{font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.kv dd{margin:0}
/* identity */
.sw{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;font:inherit;padding:0;color:var(--ink)}
.sw .c{height:84px}
.sw .t{padding:10px 12px;font-size:13px}
.sw .t b{font-family:var(--mono)}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dodont .card h3{font-size:15px}
.tone{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.tone .o{color:var(--muted);text-decoration:line-through}
.tone .n{font-weight:600}
/* loop & milestones */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.loop .card{position:relative}
.loop .card .k{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.loop .card.focus{border:2px solid var(--accent)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stage .dw{margin-top:10px;font-size:13px;font-weight:700;color:var(--accent)}
/* timeline */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-bottom:14px}
.week{font:inherit;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);cursor:pointer;color:var(--ink)}
.week b{font-family:var(--mono);display:block;color:var(--accent)}
.week small{font-size:12px}
.week[aria-selected="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.week[aria-selected="true"] b{color:#fff}
/* pricing */
.price{font-family:var(--mono);font-weight:700;font-size:28px;line-height:1.1}
.price small{font-family:var(--font);font-size:14px;font-weight:500;color:var(--muted)}
.opt{display:block;cursor:pointer;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .card{height:100%;transition:border-color .2s,box-shadow .2s}
.opt input:checked + .card{border:2px solid var(--accent);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 18%,transparent)}
.opt input:focus-visible + .card{outline:3px solid var(--accent);outline-offset:2px}
.rec{position:absolute;top:-10px;right:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
.offer{background:var(--slate);color:#fff;border-radius:var(--radius);padding:22px;margin:16px 0}
.offer .count{font-family:var(--mono);background:var(--accent);padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700}
.offer .grid .it{background:rgba(255,255,255,.07);border-radius:12px;padding:14px}
.offer .grid .it b{display:block;margin-bottom:4px}
.offer .grid .it span{font-size:14px;opacity:.8}
.addon{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:8px}
.addon input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
.addon .p{margin-left:auto;font-family:var(--mono);font-weight:700;white-space:nowrap}
.est{background:var(--paper);border:2px solid var(--slate);border-radius:var(--radius);padding:22px;margin-top:18px}
.est .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.est .row b{font-family:var(--mono)}
.est .row.total{border-bottom:0;font-size:18px;font-weight:800}
.est .row.dep{color:var(--accent);font-weight:700;border-bottom:0}
.est input[type=range]{width:100%;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* roadmap */
.road .card.cur{border:2px solid var(--accent)}
.road .stepn{font-family:var(--font);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:700}
/* portfolio */
.pf .logo{width:40px;height:40px;border-radius:10px;background:var(--slate);color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
/* closing */
.reasons{counter-reset:r}
.reasons .card{position:relative;padding-left:62px}
.reasons .card:before{counter-increment:r;content:counter(r);position:absolute;left:20px;top:20px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
ol.next{padding-left:20px}
ol.next li{padding:6px 0}
footer{background:var(--slate);color:#fff;padding:40px 0;text-align:center}
footer .actions{justify-content:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.print-only{display:none}
@media (max-width:640px){
  .crit-row{grid-template-columns:110px 1fr 20px}
  .dodont,.tone,.vs{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .hero{padding:40px 0 48px}
  section.block{padding:40px 0}
}
/* ---------- PRINT / PDF ---------- */
@page{size:A4;margin:14mm 12mm}
@media print{
  body{background:#fff;font-size:12.5px}
  .toc,.tabs,.weeks,.btn,.actions,.no-print,.toast,input[type=range]{display:none!important}
  .print-only{display:block}
  .hero{padding:28px 0 32px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero:after{display:none}
  section.block{padding:22px 0;break-inside:auto}
  .num,h2,.intro,.label,h3{break-after:avoid}
  .card,.issue,.band,.stat,.step,details.acc,.addon,.offer,.est,.callout,.ask{break-inside:avoid}
  .panel[hidden]{display:block!important}
  .panel{margin-bottom:12px}
  .panel-title{display:block;font-weight:800;font-size:15px;margin:10px 0 6px;color:var(--accent)}
  details.acc .body{display:block!important}
  details.acc summary:after{display:none}
  .issue .fix{display:block}
  .opt input:not(:checked) + .card{border:1px solid var(--line);box-shadow:none}
  .wrap{max-width:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

h tiền ra sao, rồi đến 2 cách đóng phí và chi phí."]},{"type":"why","title":"Vì sao web chậm khi đông người vào","nav":"Vì sao chậm","intro":"Hosting thuê chung giống một căn hộ chung cư dùng chung đường nước. Nhà khác mở vòi cùng lúc thì nước nhà mình yếu đi, dù mình không làm gì sai.","flow_title":"Hosting chung chia tài nguyên với hàng trăm web khác. Hosting ổn định giữ phần tài nguyên cho riêng web của mình","old_label":"Hosting chung","new_label":"Hosting ổn định","steps":[{"title":"Nhiều người vào cùng lúc","sub":"ra video mới, chạy quảng cáo, livestream"},{"title":"Máy chủ phải xử lý nhiều hơn","sub":"mỗi người xem là một yêu cầu"},{"title":"Tài nguyên đủ cho web mình","sub":"không bị web khác giành phần"},{"title":"Trang vẫn mở nhanh","sub":"người xem ở lại đọc, đăng ký"}],"result":"lúc đông người nhất cũng là lúc web chạy tốt nhất, đúng lúc cần chuyển người xem thành học viên.","tips":[{"title":"Chậm 3 giây là mất người xem","body":"Người dùng điện thoại thường không chờ trang tải quá vài giây. Với nội dung sức khoẻ, người xem đến từ một video hay một bài chia sẻ, thoát ra là họ quay lại mạng xã hội luôn."},{"title":"Lúc đông người là lúc quan trọng nhất","body":"Web thường chậm đúng ngày ra chương trình, ngày chạy quảng cáo. Đó cũng là ngày có nhiều người sẵn sàng đăng ký nhất. Hosting yếu làm mất đúng những người đáng giá nhất."},{"title":"Google cũng chấm điểm tốc độ","body":"Web chậm bị Google xếp thấp hơn khi người ta tìm kiếm. Bài viết SEO hay đến mấy mà trang tải chậm thì cũng khó lên top."}]},{"type":"custom","title":"Hosting là gì, có những loại nào","nav":"Các loại hosting","intro":"Tên miền là địa chỉ nhà, hosting là mảnh đất và căn nhà chứa toàn bộ website: chữ, ảnh, video, dữ liệu học viên. Có nhiều kiểu thuê, mỗi kiểu một mức giá, độ ổn định và mức tự lo kỹ thuật khác nhau.","html":"<style>.ht{display:grid;gap:10px}.ht-h,.ht-r{display:grid;grid-template-columns:170px 1.1fr 1fr 1fr 1fr;gap:14px;align-items:start}.ht-h{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 16px}.ht-r{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}.ht-r.us{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--paper))}.ht-r b{display:block;font-size:15px}.ht-r .k{display:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}.ht-r .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;margin-top:4px}@media (max-width:760px){.ht-h{display:none}.ht-r{grid-template-columns:1fr;gap:8px}.ht-r .k{display:block}}</style><div class='ht'><div class='ht-h'><span>Loại</span><span>Giống như</span><span>Điểm mạnh</span><span>Điểm yếu</span><span>Hợp với</span></div><div class='ht-r'><div><b>Hosting chung giá rẻ</b><span style='color:var(--muted)'>Shared hosting</span></div><div><span class='k'>Giống như</span>Phòng trọ chung: hàng trăm web dùng chung một máy chủ</div><div><span class='k'>Điểm mạnh</span>Rất rẻ, có ngay</div><div><span class='k'>Điểm yếu</span>Web khác đông người là web mình chậm. Thường giới hạn băng thông, ít hỗ trợ</div><div><span class='k'>Hợp với</span>Web cá nhân ít người xem</div></div><div class='ht-r'><div><b>Cloud hosting</b><span style='color:var(--muted)'>Đám mây</span></div><div><span class='k'>Giống như</span>Thuê chỗ trong toà nhà lớn, cần thêm phòng thì thuê thêm</div><div><span class='k'>Điểm mạnh</span>Dễ nâng cấp, ổn định hơn hosting chung</div><div><span class='k'>Điểm yếu</span>Giá thay đổi theo mức dùng, khó đoán. Thường phải tự quản trị</div><div><span class='k'>Hợp với</span>Doanh nghiệp có đội kỹ thuật</div></div><div class='ht-r'><div><b>VPS</b><span style='color:var(--muted)'>Máy chủ ảo riêng</span></div><div><span class='k'>Giống như</span>Căn hộ riêng trong chung cư: có phần tài nguyên của mình</div><div><span class='k'>Điểm mạnh</span>Tài nguyên riêng, cài gì cũng được</div><div><span class='k'>Điểm yếu</span>Phải tự cài đặt, bảo mật, sao lưu. Sập lúc nửa đêm thì tự xử lý</div><div><span class='k'>Hợp với</span>Người rành kỹ thuật</div></div><div class='ht-r'><div><b>Thuê máy chủ vật lý riêng</b><span style='color:var(--muted)'>Dedicated server</span></div><div><span class='k'>Giống như</span>Thuê nguyên một căn nhà</div><div><span class='k'>Điểm mạnh</span>Cả máy chỉ chạy web của mình, toàn quyền</div><div><span class='k'>Điểm yếu</span>Thường vài triệu mỗi tháng trở lên, cần người quản trị riêng. Đường truyền vẫn có giới hạn nên không giải quyết được chuyện nhiều người xem video cùng lúc</div><div><span class='k'>Hợp với</span>Hệ thống lớn, hàng chục nghìn người vào cùng lúc</div></div><div class='ht-r us'><div><b>Hosting Duy Web</b><span style='color:var(--muted)'>Hosting trên máy chủ vật lý tại Việt Nam, có người quản lý</span><span class='tag'>Đề xuất</span></div><div><span class='k'>Giống như</span>Căn hộ trong toà nhà xây chắc, có ban quản lý: ở ổn định, hỏng gì có người sửa</div><div><span class='k'>Điểm mạnh</span>Chạy thẳng trên máy chủ vật lý (không qua lớp máy ảo) đặt tại Việt Nam, băng thông không giới hạn, sao lưu, người theo dõi và hỗ trợ</div><div><span class='k'>Điểm yếu</span>Tài nguyên vẫn chia theo tài khoản, không phải nguyên máy riêng. Nếu sau này web có khu học viên đăng nhập rất đông, bên em sẽ báo trước để nâng lên VPS</div><div><span class='k'>Hợp với</span>Web chuyên gia, coach, phòng khám cần ổn định mà không muốn tự lo kỹ thuật</div></div></div><p class='foot'>So sánh mang tính định hướng. Thông số cụ thể của từng nhà cung cấp khác nhau.</p>"},{"type":"custom","title":"Hosting của bên em có gì","nav":"Hosting Duy Web","intro":"Hosting chạy trên máy chủ vật lý của đối tác NASANI, đặt tại Việt Nam. Bên em là đầu mối: Prohealthcare chỉ cần liên hệ một người cho mọi việc kỹ thuật. Có 2 gói, khác nhau ở dung lượng, phần video và mức bên em làm thay.","html":"<div class='grid g2'><div class='card'><div class='label' style='margin-top:0'>Khi học viên chưa đông</div><h3 style='margin-bottom:2px'>Gói Tiết kiệm</h3><div style='margin:0;font-size:14px;color:var(--muted);margin-bottom:6px'>1.000.000đ/tháng · tính theo năm · phí Cloudflare Coach đóng riêng theo tháng</div><div class='label'>Hạ tầng</div><ul class='clean'><li>Hosting 10GB trên máy chủ vật lý tại Việt Nam, dư cho web bài viết và trang bán khoá</li><li>Băng thông không giới hạn: đông người vào không bị khoá, không tính thêm tiền</li><li>Cài Cloudflare cho web (bản miễn phí) để trang tải nhanh và chặn bớt truy cập xấu</li></ul><div class='label'>An toàn</div><ul class='clean'><li>Sao lưu định kỳ, khôi phục khi xoá nhầm hoặc web lỗi</li><li>Chứng chỉ bảo mật (ổ khoá trên thanh địa chỉ)</li><li>Cập nhật phần mềm web, theo dõi web mỗi ngày</li></ul><div class='label'>Video</div><ul class='clean'><li>Mở tài khoản Cloudflare Stream đứng tên Prohealthcare, thiết lập chế độ riêng tư</li><li>Chuyển 2 khoá hiện có lên, gắn vào bài học trên web</li><li>Video mới về sau: Coach tự tải theo hướng dẫn, hoặc bên em tải giúp 100.000đ mỗi lần (tối đa 10 video)</li></ul><div class='label'>Hỗ trợ</div><ul class='clean'><li>Xử lý sự cố, trả lời Zalo trong giờ hành chính</li><li>Chuyển hosting miễn phí, không gián đoạn web</li></ul></div><div class='card' style='border:2px solid var(--accent)'><div class='label' style='margin-top:0;color:var(--accent)'>Đề xuất · không phải lo gì</div><h3 style='margin-bottom:2px'>Gói Trọn gói</h3><div style='margin:0;font-size:14px;color:var(--muted);margin-bottom:6px'>3.000.000đ/tháng · tính theo năm · đã gồm phí Cloudflare</div><div class='label'>Hạ tầng</div><ul class='clean'><li>Hosting 20GB trên máy chủ vật lý tại Việt Nam, còn chỗ cho tài liệu, hình ảnh khoá học</li><li>Băng thông không giới hạn, Cloudflare cho web</li><li>Tối ưu tốc độ hằng tháng, đo lại sau mỗi lần chỉnh</li></ul><div class='label'>An toàn</div><ul class='clean'><li>Toàn bộ phần sao lưu, bảo mật, cập nhật, theo dõi của gói Tiết kiệm</li><li>Giữ thêm một bản video gốc ở nơi sao lưu thứ hai</li></ul><div class='label'>Video</div><ul class='clean'><li>Phí Cloudflare đã gồm: 1.000 phút lưu và 30.000 phút xem mỗi tháng (khoảng 150 học viên xem hết 2 khoá)</li><li>Bên em tải video mới lên, gắn vào bài, phân quyền theo khoá cho học viên</li><li>Báo cáo lượt xem hằng tháng, cảnh báo khi dùng tới 80% hạn mức</li><li>Không có hoá đơn đô la, không cần thẻ quốc tế</li></ul><div class='label'>Hỗ trợ</div><ul class='clean'><li>Trả lời Zalo trong ngày, ưu tiên xử lý khi có chương trình hoặc ra khoá mới</li><li>Chuyển hosting miễn phí, không gián đoạn web</li></ul></div></div><div class='card' style='margin-top:14px'><div class='label' style='margin-top:0'>Bảng giá hosting NASANI (niêm yết công khai, xem ngày 30/10/2026)</div><div style='display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:8px 12px;font-size:14px'><b style='font-size:12px;color:var(--muted)'>Gói NASANI</b><b style='font-size:12px;color:var(--muted);text-align:right'>Giá/tháng</b><b style='font-size:12px;color:var(--muted);text-align:right'>Băng thông</b><b style='font-size:12px;color:var(--muted);text-align:right'>Ghi chú</b><span>10GB</span><span style='text-align:right'>648.000đ</span><span style='text-align:right'>Không giới hạn</span><span style='text-align:right'>Phần hosting gói Tiết kiệm</span><span>20GB</span><span style='text-align:right'>1.080.000đ</span><span style='text-align:right'>Không giới hạn</span><span style='text-align:right'>Phần hosting gói Trọn gói</span><span>50GB</span><span style='text-align:right'>2.160.000đ</span><span style='text-align:right'>Không giới hạn</span><span style='text-align:right'>Nếu để hết video trên hosting</span></div><p class='foot' style='margin:8px 0 0'>Đây là giá thuê hosting thuần của NASANI, đã gồm sao lưu. Gói của bên em gồm phần hosting tương ứng cộng các việc ở trên. Nguồn: nasani.vn/bang-gia-hosting.html</p></div>"},{"type":"custom","title":"2 khoá học cần bao nhiêu chỗ","nav":"Dung lượng","intro":"Bên em đã đo trực tiếp 2 thư mục khoá học Coach gửi. Mỗi bài đang có 2 bản (thường và tăng tốc), chỉ cần đưa lên 1 bản. File gốc Zoom, bản chưa sửa và slide giữ ở OneDrive, không cần lên web.","html":"<div class='card'><div style='display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px 12px;font-size:14px'><b style='font-size:12px;color:var(--muted)'>Khoá học</b><b style='font-size:12px;color:var(--muted);text-align:right'>Dung lượng</b><b style='font-size:12px;color:var(--muted);text-align:right'>Thời lượng</b><span>UC1 · Coaching nền tảng (38 video)</span><span style='text-align:right'>10,6–10,8GB</span><span style='text-align:right'>116–119 phút</span><span>UC2 · Kỹ năng coaching cho nhà quản lý (21 video đã sửa)</span><span style='text-align:right'>4,4–5,9GB</span><span style='text-align:right'>69–100 phút</span><b>Tổng cần đưa lên</b><b style='text-align:right'>15–16,7GB</b><b style='text-align:right'>185–220 phút</b></div><p class='foot'>Đo ngày 30/10/2026 từ thư mục OneDrive. Video đang ở chất lượng 1080p, khá nặng so với mức cần để xem trên web.</p></div><div class='grid g3' style='margin-top:14px'><div class='card'><div class='label' style='margin-top:0'>Phần web</div><h3>Dưới 5GB</h3><p style='margin:0;font-size:14px;color:var(--muted)'>Bài viết, hình ảnh, trang giới thiệu và bán khoá. Gói 10GB còn dư nhiều năm.</p></div><div class='card'><div class='label' style='margin-top:0'>Video nếu để trên hosting</div><h3>15–17GB, thêm khoá thì tăng tiếp</h3><p style='margin:0;font-size:14px;color:var(--muted)'>Mỗi khoá mới tương tự thêm khoảng 5–10GB. Muốn còn chỗ cho 12 tháng tới cần gói 50GB, khoảng 2.160.000đ/tháng chỉ riêng tiền hosting.</p></div><div class='card'><div class='label' style='margin-top:0'>Video nếu để ở Cloudflare</div><h3>220 / 1.000 phút</h3><p style='margin:0;font-size:14px;color:var(--muted)'>Cloudflare tính theo phút, không theo GB. Mức 1.000 phút còn chỗ cho khoảng 3–4 khoá nữa.</p></div></div><div class='card' style='margin-top:14px'><div class='label' style='margin-top:0'>Lượt xem tính thế nào</div><p style='margin:0;font-size:14px'>Một học viên xem hết 2 khoá khoảng 200 phút. Ví dụ 20 học viên xem hết trong tháng ≈ 4.000 phút xem; 100 học viên ≈ 20.000 phút. Số học viên mỗi tháng là thứ quyết định nên đóng phí Cloudflare theo cách nào (xem phần sau).</p></div>"},{"type":"custom","title":"Đề xuất: video khoá học để riêng tư trên Cloudflare","nav":"Video Cloudflare","intro":"Khoá học là sản phẩm thu phí, nên video không được để công khai. Cloudflare Stream là kho video riêng của Cloudflare: web chỉ nhúng video vào, còn việc giữ file, phát video và chặn người ngoài do Cloudflare lo.","html":"<div class='grid g2'><div class='card'><div class='label' style='margin-top:0'>Nếu để hết video trên hosting</div><ul class='clean'><li><b>Tốn tiền chỗ chứa:</b> phải thuê gói 50GB, khoảng 2.160.000đ/tháng chỉ để chứa 2 khoá và các khoá sắp tới</li><li><b>Web chậm theo:</b> mỗi học viên xem là máy chủ phải gửi đi một file lớn, nhiều người xem cùng lúc thì trang bài viết cũng chậm</li><li><b>Giật trên 4G:</b> hosting chỉ phát một chất lượng, mạng yếu là phải chờ</li><li><b>Khó giữ riêng tư:</b> file video nằm ở một đường dẫn cố định, lộ link là ai cũng tải được</li></ul></div><div class='card' style='border:2px solid var(--accent)'><div class='label' style='margin-top:0;color:var(--accent)'>Đề xuất · Cloudflare Stream chế độ riêng tư</div><ul class='clean'><li><b>Chỉ học viên mới xem được:</b> mỗi lần học viên mở bài, web tạo một link riêng có hạn dùng (mặc định 1 giờ). Copy link gửi người khác thì hết hạn là không xem được</li><li><b>Chỉ phát trên web Prohealthcare:</b> mang video nhúng sang web khác sẽ không chạy</li><li><b>Không cho tải về:</b> Cloudflare tắt sẵn nút tải, không có file gốc nằm lộ ra ngoài</li><li><b>Mượt trên mọi mạng:</b> video tự chia nhiều chất lượng, mạng yếu tự hạ xuống để không giật</li><li><b>Hosting nhẹ:</b> web chỉ còn dưới 5GB, gói 10GB là đủ</li></ul></div></div><p class='foot'>Không có cách nào chặn được 100% việc quay màn hình. Cách trên chặn được những đường lộ phổ biến: chia sẻ link, nhúng lậu, tải file.</p><div class='card' style='margin-top:14px'><div class='label' style='margin-top:0'>Cloudflare tính tiền thế nào</div><div class='grid g3' style='margin-top:6px'><div><h3 style='margin:0 0 4px'>1 · Giữ chỗ video</h3><p style='margin:0;font-size:14px;color:var(--muted)'><b style='color:var(--ink)'>5 USD/tháng cho mỗi 1.000 phút video</b>, mua trước theo từng bậc 1.000 phút. Tính theo thời lượng, không theo GB.</p></div><div><h3 style='margin:0 0 4px'>2 · Lượt xem</h3><p style='margin:0;font-size:14px;color:var(--muted)'><b style='color:var(--ink)'>1 USD cho mỗi 1.000 phút được xem</b>, tính sau theo thực tế. Băng thông đã nằm trong đây, không tính thêm.</p></div><div><h3 style='margin:0 0 4px'>3 · Miễn phí</h3><p style='margin:0;font-size:14px;color:var(--muted)'>Tải video lên, chuyển đổi sang nhiều chất lượng, chế độ riêng tư. Không có phí cài đặt.</p></div></div><div class='label'>Áp vào 2 khoá của Coach</div><ul class='clean'><li>2 khoá dài 185–220 phút → nằm trong <b>1 bậc 1.000 phút = 5 USD/tháng (khoảng 130.000đ)</b>, còn chỗ cho 3–4 khoá nữa</li><li>Một học viên xem hết 2 khoá ≈ 200 phút. Cộng thêm khoảng 30% vì trình duyệt tải trước một đoạn video trong lúc xem → ≈ 260 phút được tính tiền</li><li>Thanh toán bằng thẻ quốc tế, Cloudflare tự trừ tiền hằng tháng theo USD</li></ul></div><div class='card' style='margin-top:14px'><div class='label' style='margin-top:0'>Ví dụ phí Cloudflare mỗi tháng theo số học viên</div><div style='display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px 12px;font-size:14px'><b style='font-size:12px;color:var(--muted)'>Học viên xem hết 2 khoá</b><b style='font-size:12px;color:var(--muted);text-align:right'>Giữ chỗ</b><b s function list(a){return a&&a.length?'<ul class="clean">'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}
function para(a){return (a||[]).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function head(s,i){return '<div class="num">'+String(i).padStart(2,'0')+'</div><h2>'+esc(s.title)+'</h2>'+(s.intro?'<p class="intro">'+esc(s.intro)+'</p>':'')}
function foot(s){return s.footnote?'<p class="foot">'+esc(s.footnote)+'</p>':''}
var uid=0;
function tabs(names, panels){
  var id='t'+(++uid);
  var h='<div class="tabs" role="tablist">'+names.map(function(n,i){return '<button class="tab" role="tab" data-g="'+id+'" data-i="'+i+'" aria-selected="'+(i===0)+'">'+esc(n)+'</button>'}).join('')+'</div>';
  h+=panels.map(function(p,i){return '<div class="panel" data-g="'+id+'" data-i="'+i+'"'+(i?' hidden':'')+'><div class="panel-title">'+esc(names[i])+'</div>'+p+'</div>'}).join('');
  return h;
}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}
function copy(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(msg||'Đã chép')},function(){fallbackCopy(txt,msg)})}else fallbackCopy(txt,msg);
}
function fallbackCopy(txt,msg){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg||'Đã chép')}catch(e){}a.remove()}

/* ---------- renderers ---------- */
var R = {};
R.intro=function(s,i){return head(s,i)+(s.lead?'<p class="lead">'+esc(s.lead)+'</p>':'')+para(s.paragraphs)};
R.market=function(s,i){
  var h=head(s,i)+'<div class="grid g3">'+(s.stats||[]).map(function(x){return '<div class="card stat"><div class="v">'+esc(x.value)+'</div><div class="l">'+esc(x.label)+'</div><div class="n">'+esc(x.note)+'</div></div>'}).join('')+'</div>';
  if(s.lessons&&s.lessons.length){
    h+='<p style="margin:26px 0 12px;font-weight:600">'+esc(s.lessons_intro||'Bài học từ những đơn vị đi trước:')+'</p>';
    h+=s.lessons.map(function(l){return '<details class="acc"><summary>'+esc(l.name)+'</summary><div class="body"><p style="margin:0 0 8px">'+esc(l.summary)+'</p><div class="label">Điều có thể học</div><b>'+esc(l.lesson)+'</b></div></details>'}).join('');
  }
  return h+foot(s);
};
R.why=function(s,i){
  var h=head(s,i);
  if(s.steps){h+=(s.flow_title?'<h3>'+esc(s.flow_title)+'</h3>':'')+'<div class="vs"><div class="old">'+esc(s.old_label||'Cách cũ · đoán rồi làm')+'</div><div class="new">'+esc(s.new_label||'Duy Web · đo rồi làm')+'</div></div><div class="flow">'+s.steps.map(function(x){return '<div class="step"><b>'+esc(x.title)+'</b><small>'+esc(x.sub)+'</small></div>'}).join('')+'</div>';}
  if(s.result) h+='<div class="result"><b>Kết quả:</b> '+esc(s.result)+'</div>';
  if(s.tips&&s.tips.length){h+='<div style="margin-top:22px">'+tabs(s.tips.map(function(x){return x.title}),s.tips.map(function(x){return '<div class="card">'+esc(x.body)+'</div>'}))+'</div>'}
  return h+foot(s);
};
R.positioning=function(s,i){
  var h=head(s,i)+'<div class="bands">'+(s.bands||[]).map(function(b){return '<div class="band"><div class="bl">'+esc(b.label)+'</div>'+(b.items||[]).map(function(it){return '<span class="pill'+(it.highlight?' me':'')+'">'+esc(it.name)+'</span>'}).join('')+(b.note?'<div class="foot" style="margin-top:6px">'+esc(b.note)+'</div>':'')+'</div>'}).join('')+'</div>';
  if(s.recommendation) h+='<div class="callout"><div class="label">Định vị đề xuất</div>'+esc(s.recommendation)+'</div>';
  if(s.question) h+='<div class="ask"><div class="label">Câu hỏi cần chốt</div>'+esc(s.question)+'</div>';
  return h+foot(s);
};
R.channels=function(s,i){
  var crit=s.criteria||[], ch=s.channels||[];
  var one=ch.map(function(c){
    var sc=crit.map(function(k,j){var v=(c.scores||[])[j]||0;return '<div class="crit-row"><span>'+esc(k)+'</span><span class="score">'+[1,2,3,4,5].map(function(n){return '<i class="'+(n<=v?'on':'')+'"></i>'}).join('')+'</span><b>'+v+'</b></div>'}).join('');
    return '<div class="grid g2"><div class="card"><div class="tagline">'+esc(c.tag||'')+'</div><h3 style="margin-top:4px">'+esc(c.name)+'</h3>'+(c.customer?'<div class="label">Khách làm gì ở đây</div><p style="margin:0">'+esc(c.customer)+'</p>':'')+'<div class="label">Nhận định cho '+esc(who)+'</div><p style="margin:0">'+esc(c.assessment)+'</p></div><div class="card">'+(crit.length?sc:'')+(c.in_package&&c.in_package.length?'<div class="label">Làm trong gói</div>'+list(c.in_package):'')+(c.measure?'<div class="label">Đo gì khi đánh giá</div><p style="margin:0">'+esc(c.measure)+'</p>':'')+'</div></div>';
  });
  var h=head(s,i);
  if(crit.length&&ch.length>1){
    var byCrit=crit.map(function(k,j){var rows=ch.map(function(c){return {n:c.name,v:(c.scores||[])[j]||0}}).sort(function(a,b){return b.v-a.v});
      return '<div class="card">'+rows.map(function(r){return '<div class="crit-row"><span>'+esc(r.n)+'</span><span class="score">'+[1,2,3,4,5].map(function(n){return '<i class="'+(n<=r.v?'on':'')+'"></i>'}).join('')+'</span><b>'+r.v+'</b></div>'}).join('')+'</div>'});
    h+='<div class="no-print" style="margin-bottom:10px">'+tabs(['Xem từng kênh','So sánh theo tiêu chí'],[tabs(ch.map(function(c){return c.name}),one),tabs(crit,byCrit)])+'</div>';
    h+='<div class="print-only">'+one.map(function(p,j){return '<div class="panel-title">'+esc(ch[j].name)+'</div>'+p}).join('')+'</div>';
  } else h+=tabs(ch.map(function(c){return c.name}),one);
  return h+foot(s);
};
R.audit=function(s,i){
  var items=s.items||[];
  var h=head(s,i)+'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div class="label" style="margin-top:0">Mức sẵn sàng đón khách mới</div><b><span class="a-done">0</span>/'+items.length+' điểm đã xử lý</b> <span class="no-print" style="color:var(--muted);font-size:14px">· bấm từng điểm để xem sau khi xử lý</span></div><button class="btn alt a-all">Xử lý tất cả</button></div><div class="progress"><div class="a-bar"></div></div>';
  h+=items.map(function(x){return '<div class="issue" tabindex="0" role="button"><div class="ic">!</div><div><b>'+esc(x.issue)+'</b><div class="imp">'+esc(x.impact)+'</div><div class="fix">Hướng xử lý: '+esc(x.fix)+'</div></div></div>'}).join('');
  return h+'</div>'+foot(s);
};
R.story=function(s,i){
  var h=head(s,i)+(s.tagline?'<p class="quote">“'+esc(s.tagline)+'”</p>':'');
  if(s.pillars) h+='<div class="grid g3">'+s.pillars.map(function(p,j){return '<div class="card"><div class="tagline">Trụ '+(j+1)+'</div><h3 style="margin-top:4px">'+esc(p.title)+'</h3><p style="margin:0">'+esc(p.body)+'</p></div>'}).join('')+'</div>';
  if(s.channel_roles&&s.channel_roles.length){h+='<div style="margin-top:22px">'+tabs(s.channel_roles.map(function(c){return c.channel}),s.channel_roles.map(function(c){return '<div class="card"><dl class="kv"><dt>Vai trò</dt><dd>'+esc(c.role)+'</dd><dt>Nội dung chủ lực</dt><dd>'+esc(c.content)+'</dd><dt>Giọng điệu</dt><dd>'+esc(c.tone)+'</dd></dl></div>'}))+'</div>'}
  if(s.principle) h+='<div class="result"><b>Nguyên tắc:</b> '+esc(s.principle)+'</div>';

};

  var h=head(s,i);

  if(s.colors) h+='<div class="label">Bảng màu · bấm để chép mã</div><div class="grid g3">'+s.colors.map(function(c){return '<button class="sw" data-hex="'+esc(c.hex)+'"><div class="c" style="background:'+esc(c.hex)+'"></div><div class="t"><b>'+esc(c.hex)+'</b> · '+esc(c.name)+'<br><span style="color:var(--muted)">'+esc(c.use)+'</span></div></button>'}).join('')+'</div>';
  if(s.fonts) h+='<div class="label">Kiểu chữ</div><div class="grid g2">'+s.fonts.map(function(f){return '<div class="card"><div style="font-size:24px;font-weight:'+(f.weight||700)+'">'+esc(f.sample)+'</div><div class="foot" style="margin-top:6px">'+esc(f.name)+' · '+esc(f.use)+'</div></div>'}).join('')+'</div>';
  if(s.do||s.dont) h+='<div class="label">Quy tắc hình ảnh</div><div class="dodont"><div class="card"><h3>Nên</h3>'+list(s.do)+'</div><div class="card"><h3>Không nên</h3>'+list(s.dont)+'</div></div>';
  if(s.tone_examples) h+='<div class="label">Giọng văn</div>'+(s.tone_traits?'<div style="margin-bottom:8px">'+s.tone_traits.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>':'')+'<div class="card"><div class="tone"><div class="label" style="margin:0">Cách thường thấy</div><div class="label" style="margin:0">Cách của '+esc(who)+'</div>'+s.tone_examples.map(function(x){return '<div class="o">'+esc(x.common)+'</div><div class="n">'+esc(x.ours)+'</div>'}).join('')+'</div></div>';
  return h+foot(s);
};

  return head(s,i)+'<div class="loop">'+(s.steps||[]).map(function(x,j){return '<div class="card'+(x.focus?' focus':'')+'"><div class="k">'+(j+1)+'</div><h3>'+esc(x.title)+'</h3><p style="margin:0;color:var(--muted)">'+esc(x.body)+'</p></div>'}).join('')+'</div>'+(s.note?'<div class="result">'+esc(s.note)+'</div>':'')+foot(s);
};
R.milestones=function(s,i){

R.timeline=function(s,i){

  h+=w.map(function(x,j){return '<div class="panel" data-g="'+id+'" data-i="'+j+'"'+(j?' hidden':'')+'><div class="card"><div class="tagline">'+esc(x.label)+'</div><h3 style="margin-top:4px">'+esc(x.name)+'</h3>'+list(x.tasks)+'</div></div>'}).join('');

R.partner=function(s,i){

  h+='<div class="grid g2" style="margin-top:14px"><div class="card"><div class="label" style="margin-top:0">Chiến lược & vận hành</div><h3>'+esc(C.brand)+'</h3>'+list(p.split.us)+'</div><div class="card"><div class="label" style="margin-top:0">Kỹ thuật & hạ tầng</div><h3>'+esc(p.name)+'</h3>'+list(p.split.them)+'</div></div>';
  return h+'<p class="foot">'+esc(p.note)+'</p>';
};
R.pricing=function(s,i){
  var h=head(s,i), setup=(s.setup&&s.setup.options)||[], mon=(s.monthly&&s.monthly.options)||[], add=s.addons||[];
  var recIdx=Math.max(0,setup.findIndex(function(o){return o.recommended}));
  if(setup.length){
    h+='<div class="label">'+esc((s.setup&&s.setup.label)||'Giai đoạn 1 · Một lần')+'</div><div class="grid '+(setup.length>1?'g3':'')+'">'+setup.map(function(o,j){
      return '<label class="opt"><input type="radio" name="setup" value="'+j+'"'+(j===recIdx?' checked':'')+'><div class="card">'+(o.recommended&&setup.length>1?'<span class="rec">Đề xuất</span>':'')+'<h3>'+esc(o.name)+'</h3><div class="price">'+money(o.price)+' <small>'+esc(o.price_note||'trọn gói')+'</small></div><p style="color:var(--muted);font-size:14px">'+esc(o.desc)+'</p>'+list(o.includes)+(o.why?'<div class="label">Vì sao mức này</div><p style="margin:0;font-size:14px">'+esc(o.why)+'</p>':'')+'</div></label>'}).join('')+'</div>';
  }
  if(s.offer){
    var o=s.offer, days='';
    if(o.deadline){var d=Math.ceil((new Date(o.deadline+'T23:59:59+07:00')-new Date())/864e5);days=d>0?'Còn '+d+' ngày':'Đã hết hạn';}
    h+='<div class="offer"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><b style="font-size:18px">'+esc(o.title)+'</b><div style="opacity:.75;font-size:14px">'+esc(o.condition||'')+'</div></div>'+(days?'<span class="count">'+days+'</span>':'')+'</div><div class="grid g3" style="margin-top:14px">'+(o.items||[]).map(function(x){return '<div class="it"><b>'+esc(x.title)+'</b><span>'+esc(x.body)+'</span></div>'}).join('')+'</div>'+(o.note?'<div style="font-size:13px;opacity:.7;margin-top:10px">'+esc(o.note)+'</div>':'')+'</div>';
  }
  if(add.length){h+='<div class="label">Hạng mục thêm · chọn nếu cần</div>'+add.map(function(a,j){return '<label class="addon"><input type="checkbox" name="addon" value="'+j+'"'+(a.checked?' checked':'')+'><div><b>'+esc(a.name)+'</b><div class="foot" style="margin:0">'+esc(a.desc)+'</div></div><span class="p">+'+money(a.price)+'</span></label>'}).join('')}
  if(mon.length){
    var mrec=Math.max(0,mon.findIndex(function(o){return o.recommended}));
    h+='<div class="label" style="margin-top:22px">'+esc((s.monthly&&s.monthly.label)||'Giai đoạn 2 · Vận hành hằng tháng')+'</div><div class="grid g3">'+mon.map(function(o,j){return '<label class="opt"><input type="radio" name="monthly" value="'+j+'"'+(j===mrec?' checked':'')+'><div class="card"><div class="price">'+(+o.price?money(o.price)+' <small>/tháng</small>':'0đ <small>miễn phí</small>')+'</div><h3 style="margin-top:6px">'+esc(o.name)+'</h3><p style="margin:0;color:var(--muted);font-size:14px">'+esc(o.desc)+'</p></div></label>'}).join('')+'</div>'+(s.monthly.note?'<p class="foot">'+esc(s.monthly.note)+'</p>':'');
  }
  if(s.exclusions) h+='<p class="foot">'+esc(s.exclusions)+'</p>';
  /* estimator */
  h+='<div class="est" id="est"><div class="label" style="margin-top:0">Ước tính của anh/chị</div>';
  if(mon.length) h+='<div class="no-print"><div style="display:flex;justify-content:space-between"><span>Số tháng duy trì dự kiến</span><b id="mval">'+(s.months_default!=null?s.months_default:2)+' tháng</b></div><input type="range" id="months" min="0" max="12" value="'+(s.months_default!=null?s.months_default:2)+'"></div>';
  h+='<div id="erows"></div><div class="actions"><a class="btn acc" id="zbtn" href="https://zalo.me/'+esc(C.zalo)+'" target="_blank" rel="noopener">Xác nhận qua Zalo</a><a class="btn alt" href="tel:'+esc(C.zalo)+'">Gọi</a><button class="btn alt" id="cbtn">Chép</button></div><p class="foot no-print">Nút xác nhận chép sẵn lựa chọn của anh/chị và mở Zalo '+esc(C.phone)+'.</p></div>';
  return h+foot(s);
};

});
document.getElementById('toc').innerHTML=toc.join('');
document.getElementById('footer').innerHTML='<div style="font-weight:800;font-size:20px">'+esc(C.brand)+' · đồng hành cùng '+esc((Q.meta&&Q.meta.client_name)||'')+'</div><p style="opacity:.7">'+esc(C.phone)+' · '+esc(C.email)+'</p><div class="actions"><a class="btn acc" href="https://zalo.me/'+esc(C.zalo)+'" target="_blank" rel="noopener">Nhắn Zalo cho '+esc(C.brand)+'</a></div>';

/* ---------- interactions ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('.tab,.week');
  if(b){var g=b.dataset.g,i=b.dataset.i;
    document.querySelectorAll('[role=tab][data-g="'+g+'"]').forEach(function(x){x.setAttribute('aria-selected',x.dataset.i===i)});
    document.querySelectorAll('.panel[data-g="'+g+'"]').forEach(function(x){x.hidden=x.dataset.i!==i});return;}
  var sw=e.target.closest('.sw'); if(sw){copy(sw.dataset.hex,'Đã chép mã màu '+sw.dataset.hex);return;}
  var is=e.target.closest('.issue'); if(is){is.classList.toggle('done');audit(is.closest('section'));return;}
  var all=e.target.closest('.a-all'); if(all){var sec=all.closest('section');var its=sec.querySelectorAll('.issue');var allDone=[].every.call(its,function(x){return x.classList.contains('done')});its.forEach(function(x){x.classList.toggle('done',!allDone)});audit(sec);return;}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('issue')){e.preventDefault();e.target.click()}});
function audit(sec){var its=sec.querySelectorAll('.issue'),d=sec.querySelectorAll('.issue.done').length;sec.querySelector('.a-done').textContent=d;sec.querySelector('.a-bar').style.width=(its.length?d/its.length*100:0)+'%';sec.querySelector('.a-all').textContent=d===its.length?'Xem lại hiện trạng':'Xử lý tất cả'}

var P=(Q.sections||[]).filter(function(s){return s.type==='pricing'})[0];
var summary='';
function est(){
  if(!P) return;
  var setup=(P.setup&&P.setup.options)||[], mon=(P.monthly&&P.monthly.options)||[], add=P.addons||[];
  var si=+((document.querySelector('input[name=setup]:checked')||{}).value||0);
  var mi=+((document.querySelector('input[name=monthly]:checked')||{}).value||0);
  var mr=document.getElementById('months'), m=mr?+mr.value:0;
  if(mr) document.getElementById('mval').textContent=m+' tháng';
  var rows=[], one=0, lines=[];
  if(setup[si]){one+=+setup[si].price;rows.push([(P.setup.row_label||'Khởi tạo')+' · '+setup[si].name,setup[si].price]);lines.push('- '+setup[si].name+': '+money(setup[si].price));}
  document.querySelectorAll('input[name=addon]:checked').forEach(function(x){var a=add[+x.value];one+=+a.price;rows.push(['+ '+a.name,a.price]);lines.push('- Thêm '+a.name+': '+money(a.price));});
  var monTotal=0;
  if(mon[mi]&&m>0){monTotal=mon[mi].price*m;rows.push([mon[mi].name+' × '+m+' tháng',monTotal]);lines.push('- Vận hành '+mon[mi].name+' × '+m+' tháng: '+money(monTotal));}
  var dep=Math.round(one*(P.deposit_percent||50)/100);
  var html=rows.map(function(r){return '<div class="row"><span>'+esc(r[0])+'</span><b>'+money(r[1])+'</b></div>'}).join('');
  html+='<div class="row total"><span>Tổng'+(m>0&&mon.length?' '+(m+1)+' tháng':'')+'</span><b>'+money(one+monTotal)+'</b></div>';
  html+='<div class="row dep"><span>Đợt 1 ('+(P.deposit_percent||50)+'% phần khởi tạo)</span><b>'+money(dep)+'</b></div>';
  document.getElementById('erows').innerHTML=html;
  summary='Chào '+C.brand+', bên mình ('+((Q.meta&&Q.meta.client_name)||'')+') xác nhận báo giá:\n'+lines.join('\n')+'\nTổng: '+money(one+monTotal)+'\nĐợt 1: '+money(dep)+'\nLink: '+location.href.split('#')[0];
}
document.addEventListener('change',function(e){if(e.target.name==='setup'||e.target.name==='monthly'||e.target.name==='addon')est()});
document.addEventListener('input',function(e){if(e.target.id==='months')est()});
est();
var zb=document.getElementById('zbtn'); if(zb) zb.addEventListener('click',function(){copy(summary,'Đã chép lựa chọn, dán vào Zalo để gửi')});
var cb=document.getElementById('cbtn'); if(cb) cb.addEventListener('click',function(){copy(summary,'Đã chép lựa chọn')});
/* in PDF: mở hết mọi phần */
window.addEventListener('beforeprint',function(){document.querySelectorAll('details.acc').forEach(function(d){d.open=true})});
if(/[?&]print\b/.test(location.search)){document.querySelectorAll('details.acc').forEach(function(d){d.open=true})}
})();
</script>
</body>
</html>
