    <!-- Màn chào khi vào trang: hiện ngay từ HTML, React gỡ đi khi trang và font đã sẵn sàng -->
    <style>
      #boot{position:fixed;inset:0;z-index:9999;overflow:hidden;display:grid;place-items:center;background:#000;
        background-image:radial-gradient(60% 50% at 70% 50%,rgba(188,2,2,.38),transparent 70%),
          linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
        background-size:auto,32px 32px,32px 32px;transition:opacity .45s ease,visibility .45s ease}
      #boot.boot-out{opacity:0;visibility:hidden}
      #boot .boot-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .45s cubic-bezier(.4,0,.2,1)}
      #boot.boot-out .boot-stage{transform:scale(1.06)}
      #boot .boot-mark{position:relative;width:96px;height:96px;overflow:hidden}
      #boot .boot-mark svg{display:block;width:100%;height:100%;animation:bootReveal .8s cubic-bezier(.65,0,.35,1) both}
      #boot .boot-scan{position:absolute;top:8%;bottom:8%;left:0;width:3px;background:#fff;box-shadow:0 0 14px 4px rgba(255,0,0,.9);
        animation:bootScan .8s cubic-bezier(.65,0,.35,1) both}
      #boot .boot-lines{position:absolute;inset:0;pointer-events:none}
      #boot .boot-lines i{position:absolute;right:-40vw;height:1px;width:42vw;background:linear-gradient(90deg,transparent,rgba(255,0,0,.75));
        animation:bootLine 1.1s cubic-bezier(.2,.7,.2,1) both}
      #boot .boot-lines i:nth-child(1){top:22%;animation-delay:.05s}
      #boot .boot-lines i:nth-child(2){top:46%;animation-delay:.15s}
      #boot .boot-lines i:nth-child(3){top:70%;animation-delay:.25s}
      #boot .boot-bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
      #boot .boot-bar b{display:block;height:100%;width:40%;background:#FF0000;border-radius:2px;animation:bootBar 1.1s ease-in-out .5s infinite}
      #boot .boot-name{font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.72);
        animation:bootFade .6s ease .45s both}
      @keyframes bootReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      @keyframes bootScan{0%{transform:translateX(0);opacity:1}90%{opacity:1}100%{transform:translateX(96px);opacity:0}}
      @keyframes bootLine{from{transform:translateX(0);opacity:0}to{transform:translateX(-62vw);opacity:1}}
      @keyframes bootBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @keyframes bootFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){
        #boot,#boot .boot-stage{transition-duration:.01s}
        #boot *{animation:none!important}
        #boot .boot-scan,#boot .boot-lines{display:none}
      }
    </style>
