<style>
/* Layout: one column "lookbook ledger" — style ballot, then the outfit formula, then each outfit as a row of five slots, then the agreement table. */
:root{
  --bg:#F3EFE7; --surface:#FFFFFF; --sunk:#ECE6DB; --ink:#141312; --muted:#6A645C; --line:#DDD6CA;
  --pink:#E78EA3; --pink-ink:#9C3753; --pink-soft:#F9E3E9;
  --ok:#1F7A55; --ok-soft:#DDF1E7; --edit:#A15C07; --edit-soft:#FBEBD3; --drop:#A8322A; --drop-soft:#F7DEDA;
  --low:#3B6EA8; --mid:#7A4FB0; --high:#141312;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1C1B19; --sunk:#262421; --ink:#F2EEE7; --muted:#A7A097; --line:#33302C;
  --pink:#E78EA3; --pink-ink:#F2AABB; --pink-soft:#3A2329;
  --ok:#5DC79A; --ok-soft:#18342A; --edit:#F0B45A; --edit-soft:#3A2B14; --drop:#F08A80; --drop-soft:#3B1D1A;
  --low:#7FA9DA; --mid:#B795E6; --high:#F2EEE7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1C1B19; --sunk:#262421; --ink:#F2EEE7; --muted:#A7A097; --line:#33302C;
  --pink:#E78EA3; --pink-ink:#F2AABB; --pink-soft:#3A2329;
  --ok:#5DC79A; --ok-soft:#18342A; --edit:#F0B45A; --edit-soft:#3A2B14; --drop:#F08A80; --drop-soft:#3B1D1A;
  --low:#7FA9DA; --mid:#B795E6; --high:#F2EEE7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.wm{height:22px;width:auto;color:var(--bg)}
.top .ttl{font-weight:600;font-size:13px;letter-spacing:.04em;opacity:.8}
.top .sp{flex:1}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--bg);font-size:12px;font-weight:700;padding:5px 11px;opacity:.7}
.lang button[aria-pressed="true"]{background:var(--pink);color:#141312;opacity:1}
.people{display:flex;align-items:center;gap:6px;font-size:12px}
.people img{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);margin-left:-8px;background:var(--sunk)}
.people img:first-child{margin-left:0}

/* hero */
.hero{padding-block:36px 26px;display:grid;gap:14px}
.hero h1{font-size:clamp(30px,5.4vw,54px);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--pink-ink)}
.hero p{max-width:62ch;color:var(--muted);font-size:16px}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--edit-soft);color:var(--edit)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

section.blk{padding-block:30px;border-top:1px solid var(--line);display:grid;gap:18px}
.sechead{display:grid;gap:6px}
.sechead p{max-width:68ch}

/* styles ballot */
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.style{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.style.mine{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink-soft)}
.style .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.style .score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.style .score small{font-size:13px;color:var(--muted);font-weight:600}
.rec{font-size:11px;font-weight:700;background:var(--pink);color:#141312;border-radius:99px;padding:2px 8px;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--sunk);display:block}
.crit{display:grid;gap:5px;font-size:12.5px}
.crit .row{display:grid;grid-template-columns:minmax(0,1fr) 90px 22px;gap:8px;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.crit b{font-variant-numeric:tabular-nums;text-align:right}
.voteBtn{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.voteBtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.voters{display:flex;align-items:center;gap:6px;min-height:26px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.chipP{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);border-radius:99px;padding:2px 9px 2px 2px;font-size:12px;color:var(--ink)}
.chipP img{width:20px;height:20px;border-radius:50%}
.weights{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{font-variant-numeric:tabular-nums;text-align:center;font-weight:700}
td.win{background:var(--pink-soft)}

/* formula */
.formula{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;min-width:0}
.slot b{font-size:20px;font-weight:800}
.slot span{font-size:12.5px;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;counter-reset:r}
.rule{background:var(--surface);border-radius:var(--r);padding:14px;display:grid;gap:4px;border:1px solid var(--line)}
.rule h3{font-size:14.5px}
.rule p{font-size:13px;color:var(--muted)}

/* outfits */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.outfits{display:grid;gap:16px}
.of{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.of .hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.of .hd h3{font-size:19px;font-weight:800}
.tagS{font-size:12px;color:var(--muted)}
.acc{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.acc i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.items{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:1px;background:var(--line)}
.it{background:var(--surface);padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.it .ph{position:relative;background:var(--sunk);border-radius:8px;overflow:hidden}
.it img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.it .sl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.it .nm{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.it .pr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.tier{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;color:var(--surface)}
.tier.low{background:var(--low)}.tier.mid{background:var(--mid)}.tier.high{background:var(--high)}
.sig{position:absolute;top:6px;left:6px;background:var(--pink);color:#141312;font-size:10px;font-weight:800;border-radius:99px;padding:1px 7px}
.new{position:absolute;top:6px;right:6px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
.new.wait{background:var(--edit);color:#fff}
.season{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.it .pr{flex-wrap:wrap;gap:4px}
.ft{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:14px 16px}
.money{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-variant-numeric:tabular-nums}
.money .big{font-size:24px;font-weight:800;letter-spacing:-.01em}
.money s{color:var(--muted)}
.checks{display:grid;gap:4px;font-size:12.5px;margin-top:10px}
.checks .c{display:flex;gap:7px;align-items:flex-start}
.checks .c b{flex:none;width:16px;text-align:center}
.checks .c.y b{color:var(--ok)}.checks .c.n b{color:var(--edit)}
.vote{display:grid;gap:8px;align-content:start}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg3 button{border:0;background:var(--surface);padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg3 button+button{border-left:1px solid var(--line)}
.seg3 button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.seg3 button[aria-pressed="true"].edit{background:var(--edit);color:#fff}
.seg3 button[aria-pressed="true"].drop{background:var(--drop);color:#fff}
textarea{width:100%;min-height:60px;resize:vertical;font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.others{display:grid;gap:5px;font-size:12.5px}
.others .o{display:flex;gap:7px;align-items:flex-start}
.others .o img{width:20px;height:20px;border-radius:50%;flex:none;margin-top:1px}
.others .o .v{font-weight:700;flex:none}
.others .o .v.ok{color:var(--ok)}.others .o .v.edit{color:var(--edit)}.others .o .v.drop{color:var(--drop)}
.others .o span.t{overflow-wrap:anywhere;color:var(--muted)}

/* agreement */
.agree td .st{font-weight:700}
.st.ok{color:var(--ok)}.st.edit{color:var(--edit)}.st.drop{color:var(--drop)}.st.none{color:var(--muted)}
.copybox{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-weight:700;font-size:13.5px}
pre#copyOut{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;max-height:320px;overflow:auto;width:100%;margin:0}
footer{padding-block:28px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}

@media (max-width:760px){
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .items .it:last-child:nth-child(odd){grid-column:1/-1}
  .ft{grid-template-columns:1fr}
  .formula{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formula .slot:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.of,.style{transition:border-color .2s,box-shadow .2s}}
</style>

    const tr=tierOf(p.price);const pr=el("div","pr");pr.append(el("span",null,fmt(p.price)),el("span","tier "+tr,t("tiers")[tr]));
    it.append(el("span","sl",t("slots")[p.slot]),ph,el("span","nm",p[lang]),pr);items.append(it)});
  const ft=el("div","ft");const money=el("div","money");const r=retailOf(o),sp=setOf(o);
  const a=el("div");a.append(el("div","eyebrow",t("setPrice")),el("div","big",fmt(sp)));
  const b=el("div");b.append(el("div","eyebrow",t("retail")),el("s",null,fmt(r)));
  const c=el("div");c.append(el("div","eyebrow",t("save")),el("div",null,fmt(r-sp)));
  money.append(a,b,c);
  const ch=el("div","checks");checksOf(o).forEach(([y,txt])=>{const d=el("div","c "+(y?"y":"n"));d.append(el("b",null,y?"✓":"!"),el("span",null,txt));ch.append(d)});
  const why=el("p",null,o.why[lang]);why.style.fontSize="14.5px";why.style.alignSelf="center";
  const left=el("div");left.append(money,ch);ft.append(why,left);card.append(hd,items,ft);return card;
}
function renderOutfits(){
  const main=document.getElementById("outfits");main.textContent="";
  ["hot","cold"].forEach(s=>{main.append(el("h3","season",t("seasons")[s]));OUTFITS.filter(o=>o.season===s).forEach(o=>main.append(outfitCard(o)))});
  const alt=document.getElementById("outfits-alt");alt.textContent="";
  LATER.forEach(o=>alt.append(outfitCard(o)));
}
function renderAll(){applyText();renderStyles();renderFormula();renderOutfits()}
document.getElementById("lang-vi").onclick=()=>{lang="vi";try{localStorage.setItem("tvn-lang","vi")}catch(e){}renderAll()};
document.getElementById("lang-en").onclick=()=>{lang="en";try{localStorage.setItem("tvn-lang","en")}catch(e){}renderAll()};
renderAll();
})();
