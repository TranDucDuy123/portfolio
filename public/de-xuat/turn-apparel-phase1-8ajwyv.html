  else put(tx,$('b',null,M.client||'Báo giá'));
  var b2=$('a','btn',K.button||'Liên hệ');b2.href=safeHref(K.href);
  if(/^https?:/i.test(b2.href)){b2.target='_blank';b2.rel='noopener'}
  put(sb,tx,b2);put(app,sb);

  root.appendChild(app);
})();
</script>
<script>
(function(){
  var els=document.querySelectorAll('#app *');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(el.children.length||el.textContent.indexOf('\n')<0)continue;
    var parts=el.textContent.split('\n');el.textContent=parts[0];
    var s=document.createElement('span');s.className='en';s.textContent=parts.slice(1).join(' ');el.appendChild(s);
  }
  var t=document.querySelector('.sticky .t');if(t){var e=t.querySelector('.en');if(e)e.remove()}
})();
</script>
